mapping:
  - target: psum_reg
    type: datatype
    keep:
      - Inputs
    bypass:
      - Weights
      - Outputs
  - target: input_reg
    type: datatype
    keep:
      - Outputs
    bypass:
      - Weights
      - Inputs
  - target: weight_reg
    type: datatype
    keep:
      - Weights
    bypass:
      - Inputs
      - Outputs
  - target: global_buffer
    type: datatype
    keep:
      - Inputs
    bypass:
      - Weights
      - Outputs
  - target: DRAM
    type: datatype
    keep:
      - Weights
      - Inputs
      - Outputs
    bypass:
      []
  - target: psum_reg
    type: temporal
    factors: R1 S1 P1 Q1 C1 K1 N2
    permutation: NRSPQCK
  - target: input_reg
    type: temporal
    factors: R1 S1 P1 Q1 C10 K1 N4
    permutation: NCRSPQK
  - target: weight_reg
    type: temporal
    factors: R1 S1 P1 Q1 C1 K1 N2
    permutation: NRSPQCK
  - target: global_buffer
    type: spatial
    factors: R1 S1 P1 Q1 C1 K11 N4
    permutation: NKRSPQC
    split: 1
  - target: global_buffer
    type: temporal
    factors: R1 S1 P1 Q1 C5 K1 N1
    permutation: CRSPQKN
  - target: DRAM
    type: temporal
    factors: R1 S1 P1 Q1 C9 K3 N1
    permutation: KCRSPQN