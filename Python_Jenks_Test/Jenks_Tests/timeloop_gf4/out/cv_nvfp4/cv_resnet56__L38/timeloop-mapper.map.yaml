      - Weights
      - Outputs
    bypass:
      - Inputs
  - target: weight_reg
    type: datatype
    keep:
      []
    bypass:
      - Weights
      - Inputs
      - Outputs
  - target: global_buffer
    type: datatype
    keep:
      - Inputs
      - Outputs
    bypass:
      - Weights
