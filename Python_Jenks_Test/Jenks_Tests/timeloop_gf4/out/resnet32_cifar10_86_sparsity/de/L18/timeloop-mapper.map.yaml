      - Outputs
    bypass:
      - Weights
      - Inputs
  - target: input_reg
    type: datatype
    keep:
      - Inputs
    bypass:
      - Weights
      - Outputs
  - target: weight_reg
    type: datatype
    keep:
      - Weights
    bypass:
      - Inputs
      - Outputs
  - target: global_buffer
    type: datatype
