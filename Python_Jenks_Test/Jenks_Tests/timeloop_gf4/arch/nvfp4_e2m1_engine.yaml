# FAITHFUL NVFP4 baseline — identical to nvfp4_engine.yaml except the PE MAC is
# fp4_e2m1_mac (Aladdin fpmac at E2M1, exp 2 / mant 1) instead of the int4 proxy.
# Pair with gf4_real_engine.yaml (fpmac fp16) for the honest realistic comparison
# (both floating-point, differ only in format width).
architecture:
  version: 0.3
  subtree:
    - name: NVFP4_Engine
      attributes:
        technology: "45nm"
      local:
        - name: DRAM
          class: DRAM
          attributes:
            type: "LPDDR4"
            width: 64
            block-size: 16
            word-bits: 4
      subtree:
        - name: chip
          local:
            - name: global_buffer
              class: SRAM
              attributes:
                depth: 16384
                width: 256
                block-size: 64
                word-bits: 4
                n_banks: 8
                read_bandwidth: 32
                write_bandwidth: 32
          subtree:
            - name: PE[0..255]
              local:
                - name: weight_reg
                  class: regfile
                  attributes: { depth: 64, width: 4, word-bits: 4, block-size: 1, meshX: 16 }
                - name: input_reg
                  class: regfile
                  attributes: { depth: 64, width: 4, word-bits: 4, block-size: 1, meshX: 16 }
                - name: psum_reg
                  class: regfile
                  attributes: { depth: 16, width: 24, word-bits: 24, block-size: 1, meshX: 16 }
                - name: mac
                  class: fp4_e2m1_mac
                  attributes: { datawidth: 4, meshX: 16 }
