# GF4-Engine, decode-at-INGRESS with fp16 multiply (faithful datapath).
# 4-bit CODES stream from DRAM (word-bits 4, traffic unchanged), are decoded ONCE
# at ingress, and held DECODED as fp16 on-chip (global buffer + operand regs at
# word-bits 16, the wider-buffer cost of decode-at-ingress). The PE is a plain
# fp16 MAC (no per-MAC LUT). The ingress decode LUT itself is priced analytically
# (once per DRAM load), consistent with the rest of the study.
#
# Compare against nvfp4_engine.yaml (int4, the faithful E2M1 proxy) for the honest
# ingress+fp16 vs native-NVFP4 picture.
architecture:
  version: 0.3
  subtree:
    - name: GF4_Engine
      attributes:
        technology: "45nm"
      local:
        - name: DRAM
          class: DRAM
          attributes:
            type: "LPDDR4"
            width: 64
            block-size: 16          # 64b / 4b codes  (traffic stays 4-bit)
            word-bits: 4
      subtree:
        - name: chip
          local:
            - name: global_buffer
              class: SRAM
              attributes:
                depth: 16384
                width: 256
                block-size: 16      # 256b / 16b decoded words (was 64 for 4-bit codes)
                word-bits: 16        # decoded fp16 operands held on-chip (ingress)
                n_banks: 8
                read_bandwidth: 32
                write_bandwidth: 32
          subtree:
            - name: PE[0..255]
              local:
                - name: weight_reg
                  class: regfile
                  attributes: { depth: 64, width: 16, word-bits: 16, block-size: 1, meshX: 16 }
                - name: input_reg
                  class: regfile
                  attributes: { depth: 64, width: 16, word-bits: 16, block-size: 1, meshX: 16 }
                - name: psum_reg
                  class: regfile
                  attributes: { depth: 16, width: 32, word-bits: 32, block-size: 1, meshX: 16 }
                - name: mac
                  class: fp16_mac
                  attributes: { datawidth: 16, meshX: 16 }
