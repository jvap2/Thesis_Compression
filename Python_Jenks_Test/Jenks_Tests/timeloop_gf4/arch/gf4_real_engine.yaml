# GF4-Engine architecture, REALISTIC multiply variant.
# Identical to gf4_engine.yaml EXCEPT the per-PE MAC is lut_fp16_mac: the 4-bit
# codes still stream/store at 4-bit (DRAM, global buffer, operand regs all 4-bit),
# but the decoded magnitudes are multiplied at 16 bits, because GF4's levels are
# not 4-bit-representable. Accumulator widened to 32b for the 16x16 product.
#
# Compare against nvfp4_engine.yaml (int4 MAC) for the realistic GF4-vs-NVFP4
# picture, and against gf4_engine.yaml (int4 MAC + LUT) to isolate the
# wider-multiply penalty from the decode-table cost.
architecture:
  version: 0.3
  subtree:
    - name: GF4_Engine
      attributes:
        technology: "45nm"
      local:
        - name: DRAM
          class: DRAM
          attributes:
            type: "LPDDR4"
            width: 64
            block-size: 16          # 64b / 4b words
            word-bits: 4
      subtree:
        - name: chip
          local:
            - name: global_buffer
              class: SRAM
              attributes:
                depth: 16384        # 16K rows
                width: 256          # 256b/row
                block-size: 64      # 256/4
                word-bits: 4
                n_banks: 8
                read_bandwidth: 32
                write_bandwidth: 32
          subtree:
            - name: PE[0..255]
              local:
                - name: weight_reg
                  class: regfile
                  attributes: { depth: 64, width: 4, word-bits: 4, block-size: 1, meshX: 16 }
                - name: input_reg
                  class: regfile
                  attributes: { depth: 64, width: 4, word-bits: 4, block-size: 1, meshX: 16 }
                - name: psum_reg
                  class: regfile
                  attributes: { depth: 16, width: 32, word-bits: 32, block-size: 1, meshX: 16 }
                - name: mac
                  class: lut_fp16_mac
                  attributes: { datawidth: 4, lut_entries: 8, lut_width: 16, meshX: 16 }
